# ==============================================================================
# SafeSpace SSFRMS — Nginx Gateway & Frontend Server Configuration
# ==============================================================================

server {
    listen 80;
    server_name localhost _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml font/woff2;

    # 1. API Reverse Proxy (giữ nguyên /api prefix)
    location /api/ {
        # Ảnh trả kho / kiểm kê gửi dạng JSON base64: tối đa 5 ảnh × 5 MiB (API giới hạn 40 MiB cho 2 endpoint này)
        client_max_body_size 40m;
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (nếu cần cho live updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Health & Readiness Probes
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /health/ready {
        proxy_pass http://api:8080/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 3. Static Assets Caching (JS, CSS, Fonts, Images có hash)
    location ~* \.(?:css|js|woff2?|ttf|eot|png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 4. Frontend SPA Routing & Entry HTML (no-cache để luôn nhận bản mới)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
