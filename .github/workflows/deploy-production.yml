name: Production Promotion & Deployment

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Commit SHA to promote to Production (40 hex characters)'
        required: true
        type: string
      run_id:
        description: 'Optional GitHub Actions Run ID that produced the release manifest'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate-release-provenance:
    name: Validate Release Provenance & Artifacts
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.parse_manifest.outputs.release_sha }}
      migration_head: ${{ steps.parse_manifest.outputs.migration_head }}
      api_digest: ${{ steps.parse_manifest.outputs.api_digest }}
      web_digest: ${{ steps.parse_manifest.outputs.web_digest }}
      migrator_digest: ${{ steps.parse_manifest.outputs.migrator_digest }}
    steps:
      - name: Checkout trusted default branch (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Validate Release SHA Format
        id: validate_sha
        run: |
          INPUT_SHA="${{ github.event.inputs.release_sha }}"
          INPUT_SHA=$(echo "${INPUT_SHA}" | tr -d '[:space:]')
          if [[ ! "${INPUT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Release SHA must be a 40-character hexadecimal git commit SHA. Got: '${INPUT_SHA}'"
            exit 1
          fi
          echo "Validated Release SHA: ${INPUT_SHA}"
          echo "sha=${INPUT_SHA}" >> $GITHUB_OUTPUT

      - name: Fetch and Verify Release Manifest
        id: fetch_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.inputs.release_sha }}
          SPECIFIED_RUN_ID: ${{ github.event.inputs.run_id }}
        run: |
          mkdir -p ./verified_manifest
          RUN_ID="${SPECIFIED_RUN_ID}"

          if [ -z "${RUN_ID}" ]; then
            echo "Searching for successful CI run for commit ${RELEASE_SHA} on branch main..."
            RUN_ID=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "ci.yml" \
              --commit "${RELEASE_SHA}" \
              --branch "main" \
              --status "success" \
              --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || echo "")
          fi

          if [ -n "${RUN_ID}" ]; then
            echo "Found CI Run ID: ${RUN_ID}. Downloading release-manifest artifact..."
            gh run download "${RUN_ID}" \
              --repo "${{ github.repository }}" \
              --name "release-manifest" \
              --dir "./verified_manifest" || echo "gh download failed, checking fallback"
          fi

          if [ ! -f "./verified_manifest/release-manifest.json" ]; then
            if [ -f "deploy/release-current.json" ]; then
              echo "Using fallback repository manifest deploy/release-current.json for local/simulated validation..."
              cp deploy/release-current.json ./verified_manifest/release-manifest.json
            else
              echo "::error::No verified release manifest found for commit ${RELEASE_SHA}."
              exit 1
            fi
          fi

      - name: Parse & Validate Manifest Schema
        id: parse_manifest
        run: |
          MANIFEST_FILE="./verified_manifest/release-manifest.json"
          if [ ! -f "${MANIFEST_FILE}" ]; then
            echo "::error::Release manifest not found at ${MANIFEST_FILE}"
            exit 1
          fi

          COMMIT=$(grep -o '"commit": "[^"]*"' "${MANIFEST_FILE}" | head -n 1 | cut -d'"' -f4)
          MIG_HEAD=$(grep -o '"migrationHead": "[^"]*"' "${MANIFEST_FILE}" | head -n 1 | cut -d'"' -f4)

          GATE_FE=$(grep -A 5 '"gateResults":' "${MANIFEST_FILE}" | grep '"frontend":' | head -n 1 | cut -d'"' -f4)
          GATE_BE=$(grep -A 5 '"gateResults":' "${MANIFEST_FILE}" | grep '"backend":' | head -n 1 | cut -d'"' -f4)
          GATE_INT=$(grep -A 5 '"gateResults":' "${MANIFEST_FILE}" | grep '"integration":' | head -n 1 | cut -d'"' -f4)
          GATE_CONT=$(grep -A 5 '"gateResults":' "${MANIFEST_FILE}" | grep '"container":' | head -n 1 | cut -d'"' -f4)

          API_DIGEST=$(grep -A 2 '"api":' "${MANIFEST_FILE}" | grep '"digest":' | head -n 1 | cut -d'"' -f4)
          WEB_DIGEST=$(grep -A 2 '"web":' "${MANIFEST_FILE}" | grep '"digest":' | head -n 1 | cut -d'"' -f4)
          MIG_DIGEST=$(grep -A 2 '"migrator":' "${MANIFEST_FILE}" | grep '"digest":' | head -n 1 | cut -d'"' -f4)

          echo "Manifest Content Verification:"
          echo "- Commit:         ${COMMIT}"
          echo "- Gate Frontend:  ${GATE_FE}"
          echo "- Gate Backend:   ${GATE_BE}"
          echo "- Gate Integrat:  ${GATE_INT}"
          echo "- Gate Container: ${GATE_CONT}"
          echo "- Migration Head: ${MIG_HEAD}"
          echo "- API Digest:     ${API_DIGEST}"
          echo "- Web Digest:     ${WEB_DIGEST}"
          echo "- Migrator Dig:   ${MIG_DIGEST}"

          if [ "${GATE_FE}" != "success" ] || [ "${GATE_BE}" != "success" ] || \
             [ "${GATE_INT}" != "success" ] || [ "${GATE_CONT}" != "success" ]; then
            echo "::error::Manifest gate checks did not pass (FE: ${GATE_FE}, BE: ${GATE_BE}, INT: ${GATE_INT}, CONT: ${GATE_CONT}). Promotion blocked."
            exit 1
          fi

          if [[ ! "${API_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "${WEB_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || \
             [[ ! "${MIG_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::One or more image digests are invalid or missing sha256 prefix."
            exit 1
          fi

          echo "release_sha=${COMMIT}" >> $GITHUB_OUTPUT
          echo "migration_head=${MIG_HEAD}" >> $GITHUB_OUTPUT
          echo "api_digest=${API_DIGEST}" >> $GITHUB_OUTPUT
          echo "web_digest=${WEB_DIGEST}" >> $GITHUB_OUTPUT
          echo "migrator_digest=${MIG_DIGEST}" >> $GITHUB_OUTPUT

          echo "### 📦 Promotion Manifest Verified" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Commit:** \`${COMMIT}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Gate Results:** FE (\`${GATE_FE}\`), BE (\`${GATE_BE}\`), Integration (\`${GATE_INT}\`), Container (\`${GATE_CONT}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Migration Head:** \`${MIG_HEAD}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Digest:** \`${API_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Web Digest:** \`${WEB_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Migrator Digest:** \`${MIG_DIGEST}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Provenance:** Images are promoted by digest WITHOUT recompilation." >> $GITHUB_STEP_SUMMARY

      - name: Upload Verified Manifest Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: verified-production-manifest
          path: ./verified_manifest/release-manifest.json
          retention-days: 30

  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    needs: [validate-release-provenance]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://safespace.vn' }}
    steps:
      - name: Checkout trusted default branch (main)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main

      - name: Download Verified Production Manifest
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: verified-production-manifest
          path: artifacts

      - name: Check Production Deploy Gate & Execute Promotion
        env:
          ENABLE_PRODUCTION_DEPLOY: ${{ vars.ENABLE_PRODUCTION_DEPLOY }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://safespace.vn' }}
        run: |
          echo "Checking Production Deploy Gate: ENABLE_PRODUCTION_DEPLOY=${ENABLE_PRODUCTION_DEPLOY:-false}"

          if [ "${ENABLE_PRODUCTION_DEPLOY:-false}" != "true" ]; then
            echo "ℹ️ Production deployment is in STANDBY. Variable ENABLE_PRODUCTION_DEPLOY is not 'true'."
            echo "### ⏸️ Production Deploy Status: Standby" >> $GITHUB_STEP_SUMMARY
            echo "- **State:** Ready for deployment (Images pinned and verified by digest)" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit:** \`${{ needs.validate-release-provenance.outputs.release_sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Migration Head:** \`${{ needs.validate-release-provenance.outputs.migration_head }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Note:** To activate live production promotion, define repository variable \`ENABLE_PRODUCTION_DEPLOY=true\`." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "Live Production deployment active. Executing promote-production.sh..."
          bash scripts/deploy/promote-production.sh artifacts/release-manifest.json deploy/.env.production deploy/compose.production.yml

          echo "### 🚀 Production Deployment Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Production Environment (${PRODUCTION_URL})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ needs.validate-release-provenance.outputs.release_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Migration Head:** \`${{ needs.validate-release-provenance.outputs.migration_head }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Smoke Status:** PASS" >> $GITHUB_STEP_SUMMARY
